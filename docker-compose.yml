version: '3.8'

services:
  nexus-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-crm-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - crm-data:/app/server/data
    environment:
      - PORT=5001
      - NODE_ENV=production

volumes:
  crm-data:
    driver: local
