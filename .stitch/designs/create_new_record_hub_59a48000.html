<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create New Record - ProCRM Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
    </style>

<body class="bg-background text-on-background h-full font-body-md antialiased overflow-hidden">
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/40 backdrop-blur-sm p-margin-page">
<!-- Modal Content Container -->
<div class="glass-panel w-full max-w-3xl rounded-xl shadow-lg flex flex-col max-h-full overflow-hidden transform transition-all scale-100 opacity-100">
<!-- Header -->
<div class="flex items-center justify-between p-stack-lg border-b border-outline-variant/30 bg-surface-container-lowest/80">
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Create New Record</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit">Select the type of record you want to add to the CRM.</p>
</div>
<button aria-label="Close" class="text-on-surface-variant hover:text-primary transition-colors p-unit rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" style="font-size: 24px;">close</span>
</button>
</div>
<!-- Content Body (Bento Grid) -->
<div class="p-stack-lg overflow-y-auto bg-surface/50">
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Option 1: Recruit Mentor -->
<button class="group flex flex-col items-start p-stack-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-primary hover:shadow-md transition-all text-left">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center mb-stack-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container transition-colors" data-icon="supervisor_account">supervisor_account</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">Recruit Mentor</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Add a new mentor profile to the network, complete with expertise and availability.</p>
</button>
<!-- Option 2: Enroll Student -->
<button class="group flex flex-col items-start p-stack-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-primary hover:shadow-md transition-all text-left">
<div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center mb-stack-sm group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-on-secondary-container transition-colors" data-icon="school">school</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">Enroll Student</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Register a new student, assign them to programs, and set up their initial profile.</p>
</button>
<!-- Option 3: Add Lead -->
<button class="group flex flex-col items-start p-stack-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-primary hover:shadow-md transition-all text-left">
<div class="w-12 h-12 rounded-full bg-tertiary-container/20 flex items-center justify-center mb-stack-sm group-hover:bg-tertiary-container transition-colors">
<span class="material-symbols-outlined text-tertiary group-hover:text-on-tertiary-container transition-colors" data-icon="person_add">person_add</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">Add Lead</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Capture a new prospective client or partner for the sales pipeline.</p>
</button>
<!-- Option 4: Log Expense -->
<button class="group flex flex-col items-start p-stack-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-primary hover:shadow-md transition-all text-left">
<div class="w-12 h-12 rounded-full bg-error-container/20 flex items-center justify-center mb-stack-sm group-hover:bg-error-container transition-colors">
<span class="material-symbols-outlined text-error group-hover:text-on-error-container transition-colors" data-icon="payments">payments</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-unit">Log Expense</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Record a new financial transaction, upload receipts, and categorize spending.</p>
</button>
</div>
</div>
<!-- Footer Actions (Optional context for escaping) -->
<div class="p-stack-md border-t border-outline-variant/30 bg-surface-container-lowest/80 flex justify-end">
<button class="px-stack-md h-10 rounded text-primary font-label-md text-label-md hover:bg-surface-container-low transition-colors">Cancel</button>
</div>
</div>
</div>
</body></html>
